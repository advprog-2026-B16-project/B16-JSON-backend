name: Deploying to Production

on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:latest

      - name: Releasing New Version
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker stop web_server || true
            docker rm -f web_server || true
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:latest
            source .env
            docker run -d \
            --restart unless-stopped \
            --name=web_server \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=production \
            -e PROD_DB_URL="$PROD_DB_URL" \
            -e PROD_DB_USER="$PROD_DB_USER" \
            -e PROD_DB_PASSWORD="$PROD_DB_PASSWORD" \
            -e PROD_JPA_DDL_AUTO="${PROD_JPA_DDL_AUTO:-validate}" \
            -e PROD_SHOW_SQL="${PROD_SHOW_SQL:-false}" \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:latest
