global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'json-backend-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'spring-boot'
    static_configs:
      - targets: ['172.17.0.1:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
